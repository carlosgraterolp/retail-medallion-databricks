name: retail_medallion
version: "1.0.0"
config-version: 2
profile: retail_medallion

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: ["target", "dbt_packages"]

vars:
  # Analysis date for RFM recency: the day after the last invoice in the dataset.
  rfm_snapshot_date: "2011-12-10"
  # Incremental demo: set to a date to simulate that data only arrived up to that day.
  cutoff_date: null
  # Incremental window: from (last loaded date - lookback_days) through the newest date, inclusive,
  # so 3 means the last loaded date and the 3 days before it (4 days) are reprocessed.
  lookback_days: 3

models:
  retail_medallion:
    staging:
      +materialized: view
    marts:
      +materialized: table
