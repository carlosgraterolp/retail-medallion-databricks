# Declarative Automation Bundle (formerly "Databricks Asset Bundle").
# Defines the application resources: the pipeline job and the AI/BI dashboard.
# The platform resources (schemas, landing volume, CI service principal and its grants) are
# owned by Terraform (terraform/), so nothing is managed twice.
# The workspace host is not committed: pass it through a CLI profile, e.g.
#   databricks bundle deploy -p <profile>
bundle:
  name: retail_medallion

variables:
  catalog:
    description: Unity Catalog catalog (Free Edition provides "workspace")
    default: workspace
  gold_schema:
    description: Gold schema (created by Terraform)
    default: retail_gold
  marts_schema:
    description: dbt marts schema (created by Terraform)
    default: retail_marts
  ci_service_principal:
    description: Application ID of the CI service principal (prod target only; set by CI)
    default: ""
  warehouse_id:
    description: SQL warehouse for the dashboard (Free Edition provides one)
    lookup:
      warehouse: Serverless Starter Warehouse

resources:
  dashboards:
    retail_sales:
      display_name: Online Retail Sales
      file_path: ./dashboards/retail_sales.lvdash.json
      warehouse_id: ${var.warehouse_id}
      # Dataset queries use bare table names; the bundle supplies catalog and schema.
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.gold_schema}

  jobs:
    retail_medallion_pipeline:
      name: retail_medallion_pipeline
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
      # No cluster definition: notebook tasks run on serverless compute
      # (Free Edition is serverless-only).
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze.py
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ./notebooks/03_gold.py
        - task_key: quality_checks
          depends_on: [{ task_key: gold }]
          notebook_task:
            notebook_path: ./notebooks/04_quality_checks.py
        - task_key: dbt_marts
          depends_on: [{ task_key: quality_checks }]
          # dbt Core runs on serverless compute against the SQL warehouse;
          # Databricks generates the dbt profile and injects the run-as user's token.
          dbt_task:
            project_directory: ${workspace.file_path}/dbt
            commands: ["dbt source freshness", "dbt build"]
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${var.marts_schema}
          environment_key: dbt
      environments:
        - environment_key: dbt
          spec:
            environment_version: "4"
            dependencies:
              - dbt-databricks==1.13.1

targets:
  # Local development, deployed by a user with `-p <profile>`.
  dev:
    default: true

  # Deployed only by GitHub Actions as the github-ci service principal (OAuth M2M).
  # CI sets BUNDLE_VAR_ci_service_principal from the DATABRICKS_CLIENT_ID secret, so the root is
  # the service principal's home (only it and admins can write there; no email in paths or logs)
  # and the job runs as the service principal.
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${var.ci_service_principal}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.ci_service_principal}
    permissions:
      - level: CAN_MANAGE
        group_name: admins
      - level: CAN_MANAGE
        service_principal_name: ${var.ci_service_principal}
