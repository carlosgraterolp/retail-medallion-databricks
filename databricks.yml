# Declarative Automation Bundle (formerly "Databricks Asset Bundle").
# Defines the Unity Catalog schemas, the landing volume, the pipeline job and the
# AI/BI dashboard as code.
# The workspace host is not committed: pass it through a CLI profile, e.g.
#   databricks bundle deploy -p <profile>
bundle:
  name: retail_medallion

variables:
  catalog:
    description: Unity Catalog catalog (Free Edition provides "workspace")
    default: workspace
  warehouse_id:
    description: SQL warehouse for the dashboard (Free Edition provides one)
    lookup:
      warehouse: Serverless Starter Warehouse

resources:
  schemas:
    bronze:
      catalog_name: ${var.catalog}
      name: retail_bronze
      comment: Raw data as ingested, plus ingestion metadata
    silver:
      catalog_name: ${var.catalog}
      name: retail_silver
      comment: Cleaned, typed and deduplicated invoice lines; quarantine table
    gold:
      catalog_name: ${var.catalog}
      name: retail_gold
      comment: Kimball star schema, aggregates and data quality results
    marts:
      catalog_name: ${var.catalog}
      name: retail_marts
      comment: Business marts built by dbt on top of the gold layer

  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.bronze.name}
      name: landing
      volume_type: MANAGED
      comment: Raw CSV files uploaded with the Databricks CLI

  dashboards:
    retail_sales:
      display_name: Online Retail Sales
      file_path: ./dashboards/retail_sales.lvdash.json
      warehouse_id: ${var.warehouse_id}
      # Dataset queries use bare table names; the bundle supplies catalog and schema.
      dataset_catalog: ${var.catalog}
      dataset_schema: ${resources.schemas.gold.name}

  jobs:
    retail_medallion_pipeline:
      name: retail_medallion_pipeline
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
      # No cluster definition: notebook tasks run on serverless compute
      # (Free Edition is serverless-only).
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze.py
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ./notebooks/03_gold.py
        - task_key: quality_checks
          depends_on: [{ task_key: gold }]
          notebook_task:
            notebook_path: ./notebooks/04_quality_checks.py
        - task_key: dbt_marts
          depends_on: [{ task_key: quality_checks }]
          # dbt Core runs on serverless compute against the SQL warehouse;
          # Databricks generates the dbt profile and injects the run-as user's token.
          dbt_task:
            project_directory: ${workspace.file_path}/dbt
            commands: ["dbt source freshness", "dbt build"]
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${resources.schemas.marts.name}
          environment_key: dbt
      environments:
        - environment_key: dbt
          spec:
            environment_version: "4"
            dependencies:
              - dbt-databricks==1.13.1

targets:
  dev:
    default: true
